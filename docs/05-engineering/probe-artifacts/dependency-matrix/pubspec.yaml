name: planning_assistant_dependency_probe
description: >-
  Dependency-resolution probe for Planning Assistant. Not an app; its only
  purpose is to produce a pubspec.lock that makes docs/01-architecture/tech-stack.md
  reproducible. See docs/05-engineering/probe-artifacts/README.md.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.0
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  freezed_annotation: any
  json_annotation: ^4.12.0
  uuid: ^4.6.0
  intl: ^0.20.3
  rrule: ^0.2.18
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  permission_handler: ^13.0.2
  table_calendar: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: any
  drift_dev: ^2.34.0
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  freezed: ^4.0.1
  json_serializable: ^6.11.2
  mocktail: ^1.0.5
  fake_async: ^1.3.3
