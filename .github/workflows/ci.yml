name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  verify:
    name: 分析 · 代码生成校验 · 测试 · 守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      # ── 文档链接校验 ──────────────────────────────────────────────
      # 必须带 --self-test：它会先用已知坏链证明校验器自己能正确变红，
      # 再校验全仓。不带自检的校验结果不予采信。
      # 见 docs/05-engineering/testing-strategy.md §1.4
      - name: 文档链接（含校验器自检）
        run: python tool/check_doc_links.py --self-test

      # 坏测试扫描：拦截结构上就不可能失败的测试。
      # 同样带 --self-test —— 用已知坏样本证明扫描器自己能正确失败。
      # 见 docs/05-engineering/testing-strategy.md §3.4
      - name: 坏测试扫描（含扫描器自检）
        run: dart tool/lint_tests.dart --self-test

      # 非 raw 字面量里被静默吃掉的转义（'\b' 是退格符、'\s' 丢反斜杠）。
      # 这一族在这个项目里栽过六次，六次都只能靠事后注入才发现 ——
      # 语言在这里不给任何信号。见 docs/05-engineering/testing-strategy.md §3.5
      - name: 可疑转义扫描（含扫描器自检）
        run: dart tool/lint_dart_escapes.dart --self-test

      # 门禁只依赖工作树：拿到一份源码 zip，八道全跑得完。
      # 域 = 这个文件点名的那些 ∪ 整个 test/（flutter test 跑的是全部）。
      # 见 docs/05-engineering/testing-strategy.md §3.6
      - name: 门禁不得走出工作树（含扫描器自检）
        run: dart tool/lint_no_shell.dart --self-test

      # 需求可追溯性：每条 V1 需求都要有**用例**点它的名，
      # 豁免表只许缩短（棘轮）。同样带 --self-test。
      # 见 docs/05-engineering/conventions.md §5.1
      #
      # **这一条是补进来的，而它没接进 CI 的那段时间很说明问题**：
      # 它被造出来正是为了抓「能力存在、但没有任何入口够得着」那一族，
      # 而它自己当时就是那个形状 —— tool/ 下六个脚本，五个接了，
      # 漏的偏偏是最新加的这个。
      #
      # 更难看的是它**看起来**是条门禁：conventions.md 里写着，
      # 每次收尾我都手动跑一遍并报「全绿」。手动跑出来的绿
      # 与自动跑出来的绿在报告里长得一模一样，
      # 而前者在没人跑的时候什么也不保证。
      - name: 需求可追溯性（含自检与豁免棘轮）
        run: python tool/check_traceability.py --self-test

      - name: 静态分析
        run: dart analyze --fatal-infos --fatal-warnings

      - name: 格式
        run: dart format --output=none --set-exit-if-changed lib test tool

      # ── 代码生成产物必须与源同步 ──────────────────────────────────
      # 生成产物入库（conventions §4），因此改了注解却忘记重新生成会被这里抓到。
      - name: 代码生成校验
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet; then
            echo "::error::代码生成产物与源码不同步，请本地跑一次 build_runner 并提交"
            git diff --stat
            exit 1
          fi

      - name: 测试
        run: flutter test --coverage

      # ── 覆盖率门禁（testing-strategy §3.3）─────────────────────
      # 按目录分设阈值，不用一个全局数字：全局阈值会被稀释 ——
      # 领域层写得再差，只要别的地方行数够多，总数照样达标。
      # 同样带 --self-test：用已知覆盖率数据先证明它能正确判红判绿。
      - name: 覆盖率门禁
        run: python tool/check_coverage.py --self-test

      # ── 读取路径不依赖 Flutter（overview §6，V2 那一格）──────────
      # 用 `dart test` 而不是 `flutter test`：整条链路上任何一处引入
      # dart:ui，这一步会直接编译失败。
      # 「读一遍 import 确认没有 flutter」看不见传递依赖，这一步能。
      - name: 纯 Dart 取今日概览（不启动 Flutter binding）
        run: dart test test/domain/today_digest_pure_dart_test.dart

      # ── 导出格式的服务端契约（overview §6，V3 那一格）────────────
      # 关键在「独立」：用 Python + 标准 jsonschema 校验，
      # 不 import 本项目任何代码。Dart 侧自己读自己写的东西，
      # 证明不了「服务端无需客户端逻辑即可解析」。
      # 样例由 test/data/export_import_test.dart 产出到 build/。
      # 同样带 --self-test：先用已知畸形包证明校验器能变红。
      - name: 安装 jsonschema
        run: pip install jsonschema

      - name: 导出格式 Schema 校验（独立于客户端）
        run: python tool/validate_export.py --self-test build/export-sample.json

      # ── 守卫必须被证明能失败 ─────────────────────────────────────
      # 这一步不是走过场：注入一个真实违规，断言守卫**确实变红**。
      # 若守卫因任何原因失灵（正则写错、路径判断错、文件扫不到），
      # 它会在这里暴露，而不是在它对着违规代码报绿之后才被发现。
      # 见 docs/05-engineering/testing-strategy.md §1.4 第 ② 条
      - name: 守卫有效性（注入违规应变红）
        run: |
          set -e
          mkdir -p lib/domain/policies
          cat > lib/domain/policies/_ci_violation_probe.dart <<'EOF'
          import 'package:flutter/material.dart';
          class CiViolationProbe { Widget? w; DateTime t() => DateTime.now(); }
          EOF
          if flutter test test/architecture/layer_dependency_test.dart > /dev/null 2>&1; then
            echo "::error::守卫对着已知违规报绿 —— 守卫本身失灵，其一切结论不可信"
            rm -f lib/domain/policies/_ci_violation_probe.dart
            exit 1
          fi
          echo "守卫按预期变红"
          rm -f lib/domain/policies/_ci_violation_probe.dart
          # 还原后必须回绿，确认不是恒红
          flutter test test/architecture/layer_dependency_test.dart

  build:
    name: 构建 Android 包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug
