name: planning_assistant
description: "一个可爱清新风格的每日计划助手。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理 / DI —— ADR-0002
  flutter_riverpod: ^3.4.0
  riverpod_annotation: ^4.0.7

  # 路由
  go_router: ^18.0.1

  # 持久化 —— ADR-0003
  # 注意：不声明 sqlite3_flutter_libs，它已 EOL（sqlite3 3.x 自带原生库）
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # 模型
  # @immutable 等注解。显式声明而非依赖传递可见性——
  # 传递依赖随时可能因上游改动而消失。
  meta: ^1.16.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.6.0
  collection: ^1.19.0

  # 时间与重复规则 —— ADR-0004 / ADR-0005
  intl: ^0.20.3
  rrule: ^0.2.18
  timezone: ^0.11.1

  # 通知
  # 注意：不引入 permission_handler —— flutter_local_notifications 22.x 自带
  # requestNotificationsPermission / requestExactAlarmsPermission，
  # 引入它会强制 compileSdk 37（当前仍是预览版）。见 environment-notes §3.2。
  flutter_local_notifications: ^22.3.0

  # 日历视图骨架（样式全部自定义）
  table_calendar: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 代码生成
  # 注意：不声明 custom_lint —— 与 riverpod_lint 3.1.9 冲突。见 tech-stack §6。
  build_runner: ^2.16.0
  drift_dev: ^2.34.0
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  freezed: ^4.0.1
  json_serializable: ^6.11.0

  # 测试
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  test: ^1.31.1

flutter:
  uses-material-design: true
  generate: true

  # 字体**随包**，不运行时下载（design-system §3.1）——
  # google_fonts 默认联网取字体，与 NFR-PRIV-01（V1 不联网、不采集）冲突，
  # 且首启会字体闪烁。所以这里直接打包 asset，也不引 google_fonts 依赖。
  #
  # 只打包拉丁与数字用的圆体。中文走系统字体（§3.2）——
  # 圆体中文字库 5-10MB，V1 不打包，「可爱」由圆角/间距/配色承载。
  #
  # 这是**可变字体**（wght 轴 300-700），一个文件覆盖 Light-Bold，
  # 比打包五个静态字重小得多。选重量用 TextStyle.fontVariations。
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand[wght].ttf
