# 测试标签。
#
# `fuzz` = **随机种子**的性质测试，默认不跑。
#
# 排除它不是「怕它红」，是**红的时机不受控**：一条随机测试可能在
# 任何一次无关的提交上突然变红，而那时人正在看另一件事。
# 排除之后，它红的时候是有人主动去跑它 —— 那时他愿意查。
#
#     flutter test --tags fuzz --run-skipped
#
# `--run-skipped` 是必须的：这里用的是 `skip`，光给 `--tags`
# 只是「选中它」，跳过那一条仍然生效。
#
# 它失败时会打印种子；拿那个种子去对应的固定用例文件里加一条，
# 缺陷就从「偶发」变成「具名」。
tags:
  fuzz:
    skip: "默认不跑（随机种子）。用 flutter test --tags fuzz 跑它。"
